services:
  kafka:
    image: confluentinc/confluent-local:7.4.3
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092" # for client connections
      - "9101:9101" # JMX
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      CLUSTER_ID: 'K0EA9p0yEe6MkAAAAkKsEg'

  kafka-init-topics:
    image: confluentinc/confluent-local:7.4.3
    container_name: kafka-init-topics
    depends_on:
      - kafka
    command: "bash -c \
                'kafka-topics --create --topic telemetry.sensors.v1 \
                             --partitions 1 --replication-factor 1 --if-not-exists \
                             --bootstrap-server kafka:29092 && \
                kafka-topics --create --topic telemetry.snapshots.v1 \
                             --partitions 1 --replication-factor 1 --if-not-exists \
                             --bootstrap-server kafka:29092 && \
                kafka-topics --create --topic telemetry.hubs.v1 \
                             --partitions 1 --replication-factor 1 --if-not-exists \
                             --bootstrap-server kafka:29092'"
    init: true

  analit_postgres:
    image: postgres:16-alpine
    container_name: analit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: analit
      POSTGRES_USER: analit
      POSTGRES_PASSWORD: analit
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "6432:5432"
    volumes:
      - analit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  shopping_store_postgres:
    image: postgres:16-alpine
    container_name: shopping_store_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopping_store_db
      POSTGRES_USER: smart_home
      POSTGRES_PASSWORD: smart_home
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "6442:5432"
    volumes:
      - shopping_store_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  shopping_cart_postgres:
    image: postgres:16-alpine
    container_name: shopping_cart_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopping_cart_db
      POSTGRES_USER: smart_home
      POSTGRES_PASSWORD: smart_home
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "6452:5432"
    volumes:
      - shopping_cart_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  warehouse_postgres:
    image: postgres:16-alpine
    container_name: warehouse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: warehouse_db
      POSTGRES_USER: smart_home
      POSTGRES_PASSWORD: smart_home
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "6462:5432"
    volumes:
      - warehouse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  analit_postgres_data:
  shopping_store_postgres_data:
  shopping_cart_postgres_data:
  warehouse_postgres_data: